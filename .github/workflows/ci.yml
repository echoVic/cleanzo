name: CI

on:
  push:
    branches: [master, 'feat/**', 'fix/**']
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      # Hosted runners have no swap, which the on-device sysctl probe reads
      # as a broken vm.swapusage layout; it runs on real Macs.
      - run: go test -race -count=1 -skip '^TestNativeSysctlRawProbes$' ./...
      - run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet ./...
      - run: GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go vet ./...
      - run: bun run typecheck
      - run: bun run test:web
      - run: bun run build:web

  windows:
    runs-on: windows-latest
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: Test and report skipped tests
        shell: pwsh
        run: |
          $testLog = Join-Path $env:RUNNER_TEMP 'cleanzo-tests.jsonl'
          go test -count=1 -json ./... | Tee-Object -FilePath $testLog
          $testExit = $LASTEXITCODE
          $events = Get-Content $testLog | ForEach-Object { $_ | ConvertFrom-Json }
          $summary = @('## Skipped Windows tests')
          $skips = @($events | Where-Object { $_.Action -eq 'skip' -and $_.Test })
          foreach ($skip in $skips) {
            $messages = @($events | Where-Object {
              $_.Action -eq 'output' -and $_.Package -eq $skip.Package -and $_.Test -eq $skip.Test -and
              $_.Output -notmatch '^(===|--- SKIP:)'
            } | ForEach-Object { $_.Output.Trim() })
            $summary += "- $($skip.Test): $($messages -join ' ')"
          }
          if (!$skips.Count) { $summary += 'No tests skipped.' }
          $summary | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append | Write-Host
          exit $testExit
      - name: Read-only scan of the real Windows profile
        shell: pwsh
        env:
          CLEANZO_REAL_PROFILE_SCAN: '1'
        run: |
          $env:CLEANZO_SCAN_REPORT = Join-Path $env:RUNNER_TEMP 'scan-report.json'
          go test -count=1 -v -run '^TestWindowsJunkScanReport$' .
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-junk-scan
          path: ${{ runner.temp }}/scan-report.json
          if-no-files-found: warn

  windows-smoke:
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test tests/smoke
      - run: bun run build -- -platform windows/amd64 -debug
      - name: Install the debug build
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'build\windows-amd64\Cleanzo Setup *.exe' | Select-Object -First 1
          if (!$installer) { throw 'Cleanzo installer not found' }
          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with $($install.ExitCode)" }
      - name: Tour every view in light and dark (scan only)
        shell: pwsh
        timeout-minutes: 6
        run: ./tests/smoke/windows.ps1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-smoke
          path: |
            ${{ runner.temp }}/cleanzo-smoke/*.png
            ${{ runner.temp }}/cleanzo-smoke/errors.json
          if-no-files-found: error
