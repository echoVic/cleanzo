name: CI

on:
  push:
    branches: [master, 'feat/**']
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      # Hosted runners have no swap, which the on-device sysctl probe reads
      # as a broken vm.swapusage layout; it runs on real Macs.
      - run: go test -race -count=1 -skip '^TestNativeSysctlRawProbes$' ./...
      - run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet ./...
      - run: GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go vet ./...
      - run: bun run typecheck
      - run: bun run test:web
      - run: bun run build:web

  windows:
    runs-on: windows-latest
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: Test and report skipped tests
        shell: pwsh
        run: |
          $testLog = Join-Path $env:RUNNER_TEMP 'cleanzo-tests.jsonl'
          go test -count=1 -json ./... | Tee-Object -FilePath $testLog
          $testExit = $LASTEXITCODE
          $events = Get-Content $testLog | ForEach-Object { $_ | ConvertFrom-Json }
          $summary = @('## Skipped Windows tests')
          $skips = @($events | Where-Object { $_.Action -eq 'skip' -and $_.Test })
          foreach ($skip in $skips) {
            $messages = @($events | Where-Object {
              $_.Action -eq 'output' -and $_.Package -eq $skip.Package -and $_.Test -eq $skip.Test -and
              $_.Output -notmatch '^(===|--- SKIP:)'
            } | ForEach-Object { $_.Output.Trim() })
            $summary += "- $($skip.Test): $($messages -join ' ')"
          }
          if (!$skips.Count) { $summary += 'No tests skipped.' }
          $summary | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append | Write-Host
          exit $testExit
      - name: Read-only scan of the real Windows profile
        shell: pwsh
        env:
          CLEANZO_REAL_PROFILE_SCAN: '1'
        run: |
          $env:CLEANZO_SCAN_REPORT = Join-Path $env:RUNNER_TEMP 'scan-report.json'
          go test -count=1 -v -run '^TestWindowsJunkScanReport$' .
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-junk-scan
          path: ${{ runner.temp }}/scan-report.json
          if-no-files-found: warn

  windows-probe:
    needs: windows
    runs-on: windows-latest
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build -- -platform windows/amd64 -debug
      - name: Install the debug build
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'build\windows-amd64\Cleanzo Setup *.exe' | Select-Object -First 1
          if (!$installer) { throw 'Cleanzo installer not found' }
          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with $($install.ExitCode)" }
      - name: Probe WebView2 and capture the desktop
        shell: pwsh
        run: |
          $client = 'EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $versions = @(
            "HKCU:\Software\Microsoft\$client",
            "HKLM:\Software\Microsoft\$client",
            "HKLM:\Software\WOW6432Node\Microsoft\$client"
          ) | ForEach-Object {
            if (Test-Path $_) { (Get-ItemProperty $_ -ErrorAction SilentlyContinue).pv }
          }
          "## Windows probe" >> $env:GITHUB_STEP_SUMMARY
          "WebView2 registry versions: $($versions -join ', ') (empty means not detected)." >> $env:GITHUB_STEP_SUMMARY
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=9222'
          $app = $null
          $cdp = $null
          try {
            $app = Start-Process "$env:LOCALAPPDATA\Programs\Cleanzo\Cleanzo.exe" -PassThru
            $deadline = (Get-Date).AddSeconds(30)
            do {
              try {
                $cdp = Invoke-RestMethod 'http://127.0.0.1:9222/json/version' -TimeoutSec 2
              } catch {
                Start-Sleep -Milliseconds 500
              }
            } while (!$cdp -and (Get-Date) -lt $deadline)
          } catch {
            "Launch/probe error: $($_.Exception.Message)" >> $env:GITHUB_STEP_SUMMARY
          }
          if ($cdp) {
            "CDP reachable: $($cdp | ConvertTo-Json -Compress)" >> $env:GITHUB_STEP_SUMMARY
          } else {
            'CDP unreachable; later runs need the CapturePage fallback.' >> $env:GITHUB_STEP_SUMMARY
          }
          try {
            Add-Type -AssemblyName System.Windows.Forms
            Add-Type -AssemblyName System.Drawing
            $screen = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bitmap = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            try {
              $graphics.CopyFromScreen($screen.Left, $screen.Top, 0, 0, $bitmap.Size)
              $bitmap.Save("$env:GITHUB_WORKSPACE\windows-probe.png", [System.Drawing.Imaging.ImageFormat]::Png)
              'Desktop screenshot captured.' >> $env:GITHUB_STEP_SUMMARY
            } finally {
              $graphics.Dispose()
              $bitmap.Dispose()
            }
          } catch {
            "Screenshot unavailable: $($_.Exception.Message)" >> $env:GITHUB_STEP_SUMMARY
          } finally {
            if ($app) { Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue }
            Get-Content $env:GITHUB_STEP_SUMMARY | Write-Host
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-probe
          path: windows-probe.png
          if-no-files-found: warn
