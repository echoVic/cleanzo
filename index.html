<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f5f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#191b1f" />
    <title>Cleanzo</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content" data-i18n="a11y.skipMain">跳到主内容</a>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <img class="logo" src="/favicon.svg" width="30" height="30" alt="" aria-hidden="true" />
          <span class="brand-name" translate="no">Cleanzo</span>
        </div>
        <nav class="nav">
          <div class="nav-scroll">
            <div class="nav-main" data-nav-region>
              <span class="nav-pill" aria-hidden="true"></span>
              <div class="nav-group" role="group" aria-labelledby="nav-overview-section">
                <div id="nav-overview-section" class="nav-section" data-i18n="nav.section.overview">概览</div>
                <button class="nav-item active" data-view="status" type="button">
                  <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>
                  <span data-i18n="nav.status">系统状态</span>
                </button>
                <button class="nav-item" data-view="process" type="button">
                  <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M7 9h10M7 13h6M7 17h8"/></svg>
                  <span data-i18n="nav.process">进程</span>
                </button>
              </div>
              <div class="nav-group" role="group" aria-labelledby="nav-cleanup-section">
                <div id="nav-cleanup-section" class="nav-section" data-i18n="nav.section.cleanup">清理与空间</div>
                <button class="nav-item" data-view="clean" type="button">
                  <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c.7 4.4 3.3 7 7.7 7.7-4.4.7-7 3.3-7.7 7.7-.7-4.4-3.3-7-7.7-7.7 4.4-.7 7-3.3 7.7-7.7z"/><circle cx="17.5" cy="17.5" r="1.4"/></svg>
                  <span data-i18n="nav.clean">垃圾清理</span>
                </button>
                <button class="nav-item" data-view="fullscan" type="button">
                  <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/><path d="M8.5 11h5M11 8.5v5"/></svg>
                  <span data-i18n="nav.fullscan">空间分析</span>
                </button>
                <button class="nav-item" data-view="large" type="button">
                  <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 15h4.5L11 8l3 9 2.5-5H20"/><circle cx="12" cy="12" r="9"/></svg>
                  <span data-i18n="nav.large">大文件</span>
                </button>
                <button class="nav-item" data-view="photos" type="button">
                  <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.8"/><path d="m4 18 5-5 4 4 3-3 4 4"/></svg>
                  <span data-i18n="nav.photos">相似照片</span>
                </button>
                <button class="nav-item" data-view="apps" type="button">
                  <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="3.5" width="7.2" height="7.2" rx="2"/><rect x="13.3" y="3.5" width="7.2" height="7.2" rx="2"/><rect x="3.5" y="13.3" width="7.2" height="7.2" rx="2"/><rect x="13.3" y="13.3" width="7.2" height="7.2" rx="2"/></svg>
                  <span data-i18n="nav.apps">应用</span>
                </button>
              </div>
              <div class="nav-group nav-ai-group" role="group" aria-labelledby="nav-ai-section">
                <div id="nav-ai-section" class="nav-section" data-i18n="nav.section.ai">AI 工具</div>
                <button class="nav-item hidden" data-view="aitools" data-tool="claude" type="button">
                  <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M5.6 18.4l2.8-2.8M15.6 8.4l2.8-2.8"/></svg>
                  <span translate="no">Claude Code</span>
                </button>
                <button class="nav-item hidden" data-view="aitools" data-tool="codex" type="button">
                  <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m7.5 10 2.5 2-2.5 2M12.5 14.5h4"/></svg>
                  <span translate="no">Codex</span>
                </button>
                <button class="nav-item hidden" data-view="aitools" data-tool="trae" type="button">
                  <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h10M4 18h7"/><circle cx="18" cy="15" r="3"/><path d="m21 18-2-2"/></svg>
                  <span translate="no">TRAE</span>
                </button>
                <button class="nav-item hidden" data-view="skills" type="button">
                  <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 7l8 4 8-4z"/><path d="m4 12 8 4 8-4"/><path d="m4 17 8 4 8-4"/></svg>
                  <span data-i18n="nav.skills">技能</span>
                </button>
              </div>
            </div>
          </div>
          <div class="nav-footer" data-nav-region>
            <span class="nav-pill" aria-hidden="true"></span>
            <button class="nav-item" data-view="settings" type="button">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>
              <span data-i18n="nav.settings">设置</span>
            </button>
            <div id="app-version" class="sidebar-foot muted" translate="no">Cleanzo</div>
          </div>
        </nav>
      </aside>

      <main class="content" id="main-content" tabindex="-1">
        <!-- 系统状态（React 页面，内容由 React 挂载） -->
        <section id="view-status" class="view">
          <div id="status-react-root"></div>
        </section>

        <!-- 进程（React 页面，内容由 React 挂载） -->
        <section id="view-process" class="view hidden">
          <div id="process-react-root"></div>
        </section>

        <!-- 垃圾清理（React 页面，内容由 React 挂载） -->
        <section id="view-clean" class="view hidden">
          <div id="clean-react-root"></div>
        </section>

        <!-- AI 工具（React 页面，内容由 React 挂载） -->
        <section id="view-aitools" class="view hidden">
          <div id="ai-react-root" class="relative"></div>
        </section>

        <!-- 技能（React 页面，内容由 React 挂载） -->
        <section id="view-skills" class="view hidden">
          <div id="skills-react-root"></div>
        </section>

        <!-- 全盘扫描（React 页面，内容由 React 挂载） -->
        <section id="view-fullscan" class="view hidden">
          <div id="fullscan-react-root"></div>
        </section>

        <!-- 大文件专清（React 页面，内容由 React 挂载） -->
        <section id="view-large" class="view hidden">
          <div id="large-react-root"></div>
        </section>

        <!-- 相似照片（React 页面，内容由 React 挂载） -->
        <section id="view-photos" class="view hidden">
          <div id="photos-react-root"></div>
        </section>

        <!-- 应用卸载（React 页面，内容由 React 挂载） -->
        <section id="view-apps" class="view hidden">
          <div id="apps-react-root"></div>
        </section>

        <!-- 设置（React 页面，内容由 React 挂载） -->
        <section id="view-settings" class="view hidden">
          <div id="settings-react-root"></div>
        </section>
      </main>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
